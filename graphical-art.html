<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphical Art - SVG</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #120609; font-family: Georgia, serif; color: #e8dcd0; }
  h1 { text-align: center; font-weight: normal; letter-spacing: .3em; font-size: 20px; color: #b3122b; margin-bottom: 32px; }
  .gallery { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { margin: 0; text-align: center; }
  img { display: block; border: 2px solid #5a0f1e; }
  figcaption { margin-top: 10px; font-size: 13px; letter-spacing: .05em; color: #c9b8ae; }
</style>
</head>
<body>
<h1>N O C T U R N E</h1>
<div class="gallery">
  <figure>
    <img src="svg1.svg" width="200" height="300" alt="Line and Circle">
    <figcaption>1. Line and Circle</figcaption>
  </figure>
  <figure>
    <img src="svg2.svg" width="200" height="300" alt="Circle and Rectangle">
    <figcaption>2. Circle and Rectangle</figcaption>
  </figure>
  <figure>
    <img src="svg3.svg" width="200" height="300" alt="Polyline and Circle">
    <figcaption>3. Polyline and Circle</figcaption>
  </figure>
  <figure>
    <img src="svg4.svg" width="200" height="300" alt="Polygon and Ellipse">
    <figcaption>4. Polygon and Ellipse</figcaption>
  </figure>
  <figure>
    <img src="svg5.svg" width="200" height="300" alt="Circle, Line and Rectangle">
    <figcaption>5. Circle, Line and Rectangle</figcaption>
  </figure>
  <figure>
    <img src="svg6.svg" width="200" height="300" alt="Polyline and Polygon">
    <figcaption>6. Polyline and Polygon</figcaption>
  </figure>
  <figure>
    <img src="svg7.svg" width="200" height="300" alt="Circle, Rectangle, Polyline, Polygon and Ellipse">
    <figcaption>7. Circle, Rectangle, Polyline, Polygon and Ellipse</figcaption>
  </figure>
</div>
</body>
</html>
